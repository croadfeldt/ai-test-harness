<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" font-family="Red Hat Text, Overpass, Open Sans, sans-serif">
  <text x="0" y="16" font-size="15" font-weight="600" fill="#151515">What a typical codebase ships</text>
  <rect x="0.5" y="28.5" width="299" height="196" fill="#d2d2d2" stroke="#151515"/>
  <text x="16" y="118" font-size="30" font-weight="700" fill="#151515">77%</text>
  <text x="16" y="140" font-size="14" fill="#151515">open source your team never wrote</text>
  <rect x="0.5" y="224.5" width="299" height="58" fill="#EE0000" stroke="#151515"/>
  <text x="16" y="252" font-size="30" font-weight="700" fill="#ffffff">23%</text>
  <text x="16" y="272" font-size="14" fill="#ffffff">your own code</text>
  <text x="0" y="297" font-size="10" fill="#6a6e73">Source: Synopsys OSSRA 2024 (audited commercial codebases)</text>
</svg>
