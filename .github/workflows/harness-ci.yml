name: Harness self-verification and tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: harness } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Stage 0 register checks (no environment probes on CI)
        run: harness selfcheck --no-probes
      - run: pytest -q
