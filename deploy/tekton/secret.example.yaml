# The model endpoint for a namespace. Create it out of band; never commit a filled copy.
apiVersion: v1
kind: Secret
metadata: { name: harness-model }
type: Opaque
stringData:
  HARNESS_MODEL_BASE_URL: "http://model-endpoint.example:8000/v1"
  HARNESS_MODEL: ""
  HARNESS_MODEL_LABEL: "cluster-model"
  HARNESS_MODEL_THINKING: "off"
  HARNESS_MODEL_REASONING: "default"
---
# The forge, for the propose task: where the test pull request goes and the identity that opens it.
apiVersion: v1
kind: Secret
metadata: { name: harness-forge }
type: Opaque
stringData:
  HARNESS_OVERLAY_URL: "https://github.com/example/test-overlays.git"
  HARNESS_FORGE_TOKEN: ""      # push a branch and open a request on the overlay repository (and on the repository under test, for first-party changes)
  HARNESS_PROPOSE_AUTHOR: "AI Test Harness"
  HARNESS_PROPOSE_EMAIL: "ai-test-harness@example.invalid"

