# Local configuration for the AI Test Harness. Copy to harness.local.toml (git-ignored) and fill in.
# Precedence: command-line flag, then environment variable, then this file. Nothing about a
# particular machine, network, or account belongs in the repository; it belongs here.

[model]
# Any OpenAI-compatible chat endpoint (vLLM, LM Studio, OpenShift AI, a hosted API).
base_url = "http://localhost:1234/v1"          # env: HARNESS_MODEL_BASE_URL
name = ""                                      # env: HARNESS_MODEL; empty = first id the endpoint lists
label = "local"                                # what the records call this endpoint; the address itself is never recorded
api_key_env = ""                               # name of an env var holding a bearer token, if the endpoint needs one
reasoning = "none"                             # LM Studio's off switch ("none") or the depth a vLLM thinking run uses ("low" | "medium" | "high" | "xhigh" | "default")
thinking = "off"                               # vLLM: chat_template_kwargs.enable_thinking ("off" | "on" | "default")
temperature = 0.2                              # env: HARNESS_MODEL_TEMPERATURE
presence_penalty = 0.0                         # env: HARNESS_MODEL_PRESENCE_PENALTY; Qwen's lever against repetition inside thinking, sent only when set
max_tokens = 6000

[target]
# The repository the harness reacts to, on this machine.
repo = "../../my-application"                  # env: HARNESS_TARGET_REPO; a path on this machine, recorded only by its name
manifest = "requirements.txt"
python_version = "3.12"

[sandbox]
image = "docker.io/library/python:3.12-slim"   # recorded by tag and by digest
go_image = "docker.io/library/golang:1.25-bookworm"   # the Go sandbox (env: HARNESS_GO_SANDBOX_IMAGE)

[udlm]
# Records in UDLM form (TestEvidence, VexStatement, Vulnerability, SoftwarePackage, Job) are emitted by
# `harness attest`. Sealing uses UDLM's own chain code from a local checkout of croadfeldt/udlm.
repo = "../../udlm"                            # env: HARNESS_UDLM_REPO; path on this machine, never recorded
estate = "example"                             # handle prefix for the records this install emits
tenant_uuid = "00000000-0000-4000-8000-000000000000"   # the tenant the records belong to
provider_handle = "example/providers/ai-test-harness"  # how this harness names itself as a provenance source
time_source = "harness-clock"
